group 'twilio.flutter.twilio_conversations'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "twilio.flutter.twilio_conversations"
    compileSdkVersion 29

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 21
    }
    lintOptions {
        disable 'InvalidPackage'
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    // 6.x: the first line whose native library (libtwilio-convo-native.so) is
    // 16 KB page-aligned, which Google Play requires for updates from
    // 2027-02-01. 1.6.0 shipped it 4 KB-aligned. 6.2.x depends on ktor 3.1.2,
    // whose own floor is kotlinx-coroutines 1.10.1, so apps must NOT pin
    // coroutines to 1.6.4 any more (that pin existed only for the ktor 1.6.0
    // bundled with Twilio 1.6.0).
    implementation 'com.twilio:conversations-android:6.2.1'

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation "androidx.multidex:multidex:2.0.1"
}
